<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NMA BUILD FIELD X1</title><style>
:root{--bg:#07111f;--panel:#0d1b2d;--line:#21334b;--text:#ecf4ff;--muted:#8ca1ba;--blue:#28a8ff;--green:#39dc88;--red:#ff5964;--amber:#ffbe3d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101c,#091827);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:var(--blue)}.wrap{padding:18px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.card{background:rgba(13,27,45,.92);border:1px solid var(--line);border-radius:18px;padding:18px}.hero{font-size:30px;font-weight:900;margin:0 0 8px}.muted{color:var(--muted)}input,select,textarea{width:100%;background:#071321;color:#fff;border:1px solid #2a4668;border-radius:12px;padding:12px;margin:6px 0 10px}button{border:0;border-radius:14px;padding:14px 18px;font-weight:900;cursor:pointer}.scan{width:100%;font-size:24px;background:var(--blue);color:#00101d}.secondary{background:#18304c;color:#fff}.status{font-size:46px;font-weight:1000;text-align:center;padding:16px}.pass{color:var(--green)}.stop{color:var(--red)}.steps{display:grid;gap:8px}.step{display:flex;justify-content:space-between;padding:10px 12px;background:#0a1727;border-radius:10px;border:1px solid #1d3551}.pill{padding:4px 8px;border-radius:20px;background:#173453}.log{white-space:pre-wrap;background:#06101c;border-radius:12px;padding:12px;min-height:120px;color:#b8cbe1}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{font-size:24px}}
</style></head><body><div class="top"><div class="brand">NMA <b>BUILD OS</b> · FIELD X1</div><div id="device">iPad 10ª gen.</div></div><div class="wrap"><div class="grid"><section class="card"><h1 class="hero">Operatore guidato</h1><p class="muted">Un solo flusso: lavoro → SCAN → controllo → PASS/STOP → chiusura.</p><label>ID lavoro</label><input id="job" placeholder="es. ERG-2026-001"><button class="secondary" onclick="loadJob()">APRI LAVORO</button><div id="steps" class="steps"></div><button class="scan" onclick="scan()">SCAN</button><div id="log" class="log">Nessun dato fittizio: la schermata attende un lavoro reale.</div></section><aside class="card"><div class="muted">CONTROLLO PRIMA DELLA CHIUSURA</div><div id="status" class="status">—</div><div id="reasons" class="muted"></div><hr style="border-color:#21334b"><h3>Prossima azione</h3><div id="next" style="font-size:20px;font-weight:800">Apri un lavoro</div></aside></div></div><script>
const $=id=>document.getElementById(id); let current=null;
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||('HTTP '+r.status));return j}
function render(j){current=j.job; $('status').textContent=j.readiness.status;$('status').className='status '+(j.readiness.status==='PASS'?'pass':'stop');$('reasons').textContent=j.readiness.reasons.join(' · ')||'Controlli completati';$('next').textContent=j.nextAction.label;const s=current.steps||{};$('steps').innerHTML=Object.entries(s).map(([k,v])=>`<div class="step"><span>${k}</span><span class="pill">${v.status}</span></div>`).join('')}
async function loadJob(){try{const id=$('job').value.trim();const j=await api('/api/field/jobs/'+encodeURIComponent(id));render(j);$('log').textContent='Lavoro caricato. BUILD OS non genera misure: attende dati dai dispositivi reali.'}catch(e){$('log').textContent=e.message}}
async function scan(){if(!current){$('log').textContent='Apri prima un lavoro.';return}$('log').textContent='Richiesta SCAN pronta. Il gateway X1 deve inviare RTK/LiDAR/foto/termica reali all’endpoint /api/field/jobs/'+current.jobId+'/scan';}
</script></body></html>
