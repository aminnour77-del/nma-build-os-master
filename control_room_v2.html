<!doctype html>
<html lang="it">
<head>

<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>NMA BUILD OS — Control Room</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#050d11;
  --panel:#0b1920;
  --line:#203e47;
  --text:#f0f7f8;
  --muted:#78969e;
  --green:#20e88b;
  --cyan:#23d8ff;
  --orange:#ff9d21;
  --red:#ff6262;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#11313a,#050d11 48%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  padding:18px;
  border-bottom:1px solid var(--line);
  background:rgba(5,13,17,.96);
}

.brand{
  font-size:20px;
  font-weight:900;
  letter-spacing:.08em;
}

.status{
  margin-top:5px;
  color:var(--green);
  font-size:12px;
}

main{
  width:min(1200px,100%);
  margin:auto;
  padding:16px 16px 70px;
}

nav{
  display:flex;
  gap:8px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:800;
}

.primary{
  background:var(--cyan);
  color:#031419;
}

.secondary{
  background:#172d35;
  color:white;
}

.kpis{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.kpi{
  background:rgba(11,25,32,.95);
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
}

.kpi .label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.07em;
}

.kpi .value{
  margin-top:7px;
  font-size:25px;
  font-weight:900;
}

.green{color:var(--green)}
.cyan{color:var(--cyan)}
.orange{color:var(--orange)}
.red{color:var(--red)}

.panel{
  margin-top:14px;
  background:rgba(11,25,32,.95);
  border:1px solid var(--line);
  border-radius:13px;
  padding:15px;
}

.panel h2{
  color:var(--cyan);
  font-size:13px;
  letter-spacing:.08em;
}

.row{
  display:grid;
  grid-template-columns:
    1.2fr 1fr 1fr .8fr .6fr .8fr;
  gap:8px;
  padding:10px 4px;
  border-bottom:1px solid #162f37;
  font-size:12px;
}

.row:last-child{
  border-bottom:0;
}

.head{
  color:var(--muted);
  text-transform:uppercase;
  font-size:10px;
}

.badge{
  font-weight:800;
}

footer{
  margin-top:15px;
  color:var(--muted);
  font-size:11px;
}

@media(max-width:850px){
  .kpis{
    grid-template-columns:repeat(2,1fr);
  }

  .row{
    grid-template-columns:1fr 1fr;
  }

  .head{
    display:none;
  }
}

</style>
</head>

<body>

<header>
  <div class="brand">
    NMA BUILD OS — CONTROL ROOM
  </div>

  <div id="systemStatus"
       class="status">
    ● CONNESSIONE SISTEMA...
  </div>
</header>

<main>

<nav>
  <button class="primary"
          onclick="carica()">
    AGGIORNA
  </button>

  <button class="secondary"
          onclick="location.href='/supervisore'">
    SUPERVISORE
  </button>

  <button class="secondary"
          onclick="location.href='/audit'">
    AUDIT
  </button>

  <button class="secondary"
          onclick="location.href='/ufficio'">
    MAPPA / CONTROL ROOM 3D
  </button>
</nav>

<div class="kpis">

  <div class="kpi">
    <div class="label">Interventi</div>
    <div id="totale" class="value cyan">0</div>
  </div>

  <div class="kpi">
    <div class="label">Validati</div>
    <div id="validati" class="value green">0</div>
  </div>

  <div class="kpi">
    <div class="label">Da correggere</div>
    <div id="correzioni" class="value orange">0</div>
  </div>

  <div class="kpi">
    <div class="label">Metri</div>
    <div id="metri" class="value">0</div>
  </div>

  <div class="kpi">
    <div class="label">Anomalie</div>
    <div id="anomalie" class="value red">0</div>
  </div>

  <div class="kpi">
    <div class="label">Registrati</div>
    <div id="registrati" class="value">0</div>
  </div>

  <div class="kpi">
    <div class="label">Raccordi</div>
    <div id="raccordi" class="value">0</div>
  </div>

  <div class="kpi">
    <div class="label">Evidenze</div>
    <div id="evidenze" class="value">0</div>
  </div>

  <div class="kpi">
    <div class="label">Eventi Audit</div>
    <div id="audit" class="value">0</div>
  </div>

  <div class="kpi">
    <div class="label">Cantieri</div>
    <div id="cantieri" class="value">0</div>
  </div>

</div>

<div class="panel">

  <h2>ULTIMI INTERVENTI</h2>

  <div class="row head">
    <div>Intervento</div>
    <div>Cantiere</div>
    <div>Operatore</div>
    <div>Stato</div>
    <div>Metri</div>
    <div>Anomalia</div>
  </div>

  <div id="interventi"></div>

</div>

<footer id="updated"></footer>

</main>

<script>

const esc=v=>
  String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;');

function set(id,value){
  document.getElementById(id).textContent=value;
}

async function carica(){

  try{

    const r=
      await fetch(
        '/api/operations-summary'
      );

    const data=
      await r.json();

    if(!r.ok || !data.ok){
      throw new Error();
    }

    const k=data.kpi;

    set('totale',k.interventi_totali);
    set('validati',k.validati);
    set('correzioni',k.da_correggere);
    set('metri',Number(k.metri).toFixed(2));
    set('anomalie',k.anomalie);
    set('registrati',k.registrati);
    set('raccordi',k.raccordi);
    set('evidenze',k.evidenze);
    set('audit',k.eventi_audit);
    set('cantieri',k.cantieri);

    const status=
      document.getElementById(
        'systemStatus'
      );

    status.textContent=
      data.status==='OPERATIONAL'
        ? '● SYSTEM STATUS: OPERATIONAL'
        : '● SYSTEM STATUS: DEGRADED';

    const box=
      document.getElementById(
        'interventi'
      );

    if(!data.ultimi_interventi.length){

      box.innerHTML=
        '<div class="row">'+
        '<div>Nessun intervento registrato</div>'+
        '</div>';

    }else{

      box.innerHTML=
        data.ultimi_interventi
          .map(x=>`

          <div class="row">

            <div>
              ${esc(x.id_intervento)}
            </div>

            <div>
              ${esc(x.id_cantiere)}
            </div>

            <div>
              ${esc(x.operatore)}
            </div>

            <div class="badge">
              ${esc(x.stato)}
            </div>

            <div>
              ${Number(
                x.tubazione?.metri || 0
              ).toFixed(2)}
            </div>

            <div>
              ${
                x.anomalia?.presente
                  ? '⚠ SÌ'
                  : 'NO'
              }
            </div>

          </div>

        `).join('');
    }

    document.getElementById(
      'updated'
    ).textContent=
      'Aggiornamento: '+
      new Date(
        data.generato_il
      ).toLocaleString();

  }catch{

    document.getElementById(
      'systemStatus'
    ).textContent=
      '● ERRORE CONNESSIONE CONTROL ROOM';
  }
}

carica();

setInterval(
  carica,
  30000
);

</script>

</body>
</html>
