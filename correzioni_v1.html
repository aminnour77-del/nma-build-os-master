<!doctype html>
<html lang="it">

<head>

<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">

<title>NMA BUILD OS — Correzioni</title>

<style>

*{box-sizing:border-box}

body{
 margin:0;
 background:#061015;
 color:#eef7f8;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
 position:sticky;
 top:0;
 z-index:10;
 background:#08141a;
 border-bottom:1px solid #244650;
 padding:16px;
}

.head{
 max-width:900px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.brand{
 font-weight:900;
 letter-spacing:.06em;
}

.live{
 color:#20e88b;
 font-size:12px;
 margin-top:5px;
}

button{
 border:0;
 border-radius:9px;
 padding:11px 14px;
 font-weight:900;
 cursor:pointer;
}

.back{
 background:#17303a;
 color:white;
}

main{
 max-width:900px;
 margin:auto;
 padding:16px 16px 70px;
}

.card{
 background:#0d1b22;
 border:1px solid #244650;
 border-radius:14px;
 padding:15px;
 margin-bottom:13px;
}

.id{
 color:#23d8ff;
 font-family:monospace;
 font-size:12px;
 word-break:break-word;
}

.request{
 margin:13px 0;
 padding:12px;
 border-radius:9px;
 background:#3b2510;
 border:1px solid #77521c;
 color:#ffd166;
 line-height:1.5;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

label{
 display:block;
 color:#849da4;
 font-size:10px;
 margin-bottom:5px;
 text-transform:uppercase;
}

input,select,textarea{
 width:100%;
 background:#071419;
 color:white;
 border:1px solid #31515a;
 border-radius:8px;
 padding:11px;
 font-size:14px;
}

textarea{
 min-height:85px;
 resize:vertical;
}

.field{
 margin-top:10px;
}

.send{
 width:100%;
 margin-top:14px;
 background:#20e88b;
 color:#032016;
}

.empty{
 text-align:center;
 color:#78959c;
 padding:50px 10px;
}

.msg{
 margin-top:10px;
 font-size:12px;
 line-height:1.5;
}

@media(max-width:650px){
 .grid{
  grid-template-columns:1fr;
 }
}

</style>

</head>

<body>

<!-- NMA_CORREZIONI_OPERATORE_V1 -->

<header>

<div class="head">

 <div>

  <div class="brand">
   NMA BUILD OS
  </div>

  <div class="live">
   ● CORREZIONI OPERATORE
  </div>

 </div>

 <button
  class="back"
  onclick="location.href='/cantiere'">
  CAMPO
 </button>

</div>

</header>

<main>

<div id="lista">
 <div class="empty">
  Caricamento correzioni...
 </div>
</div>

</main>

<script>

const esc=v=>
 String(v??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#039;");

function ultimaRichiesta(x){

 const list=
  Array.isArray(x.correzioni)
   ? x.correzioni
   : [];

 for(
  let i=list.length-1;
  i>=0;
  i--
 ){
  if(list[i].risolta!==true){
   return list[i];
  }
 }

 return null;
}

async function carica(){

 const box=
  document.getElementById(
   'lista'
  );

 try{

  const r=
   await fetch(
    '/api/correzioni',
    {cache:'no-store'}
   );

  const data=
   await r.json();

  if(
   !r.ok ||
   !data.ok
  ){
   throw new Error(
    data.error ||
    'Errore lettura'
   );
  }

  if(!data.interventi.length){

   box.innerHTML=
    '<div class="empty">'+
    '✓ Nessun intervento da correggere.'+
    '</div>';

   return;
  }

  box.innerHTML=
   data.interventi.map(x=>{

    const id=
     esc(x.id_intervento);

    const richiesta=
     ultimaRichiesta(x);

    const noteSupervisore=
     richiesta?.note ||
     x.validazione?.note ||
     'Correzione richiesta dal Supervisore.';

    return `
    <div class="card">

     <div class="id">
      ${id}
     </div>

     <strong>
      ${esc(x.id_cantiere)}
     </strong>

     <div class="request">
      <strong>CORREZIONE RICHIESTA</strong>
      <br>
      ${esc(noteSupervisore)}
     </div>

     <div class="grid">

      <div>
       <label>Materiale</label>
       <input
        id="mat-${id}"
        value="${esc(x.tubazione?.materiale || '')}">
      </div>

      <div>
       <label>Diametro mm</label>
       <input
        id="dia-${id}"
        type="number"
        min="0"
        step="0.01"
        value="${esc(x.tubazione?.diametro_mm || '')}">
      </div>

      <div>
       <label>Metri posati misurati</label>
       <input
        id="met-${id}"
        type="number"
        min="0"
        step="0.01"
        value="${esc(x.tubazione?.metri || '')}">
      </div>

      <div>
       <label>Raccordi</label>
       <input
        id="rac-${id}"
        type="number"
        min="0"
        step="1"
        value="${esc(x.raccordi || 0)}">
      </div>

     </div>

     <div class="field">

      <label>Anomalia</label>

      <select id="ano-${id}">
       <option
        value="false"
        ${x.anomalia?.presente ? '' : 'selected'}>
        NO
       </option>

       <option
        value="true"
        ${x.anomalia?.presente ? 'selected' : ''}>
        SÌ
       </option>
      </select>

     </div>

     <div class="field">

      <label>Descrizione anomalia</label>

      <textarea
       id="adesc-${id}"
      >${esc(x.anomalia?.descrizione || '')}</textarea>

     </div>

     <div class="field">

      <label>Note operative</label>

      <textarea
       id="note-${id}"
      >${esc(x.note || '')}</textarea>

     </div>

     <div class="field">

      <label>
       Descrivi cosa hai corretto *
      </label>

      <textarea
       id="ris-${id}"
       placeholder="Es. corretta metratura e diametro rilevati sul campo..."
      ></textarea>

     </div>

     <button
      class="send"
      onclick="reinvia('${id}',this)">
      REINVIA AL SUPERVISORE
     </button>

     <div
      class="msg"
      id="msg-${id}">
     </div>

    </div>
    `;

   }).join('');

 }catch(e){

  box.innerHTML=
   '<div class="empty">'+
   esc(e.message)+
   '</div>';
 }
}

async function reinvia(
 id,
 button
){

 const msg=
  document.getElementById(
   'msg-'+id
  );

 const nota=
  document.getElementById(
   'ris-'+id
  ).value.trim();

 if(!nota){

  msg.style.color='#ff9d21';

  msg.textContent=
   'Descrivi la correzione effettuata.';

  return;
 }

 const payload={

  tubazione:{

   materiale:
    document.getElementById(
     'mat-'+id
    ).value.trim(),

   diametro_mm:
    Number(
     document.getElementById(
      'dia-'+id
     ).value
    ),

   metri:
    Number(
     document.getElementById(
      'met-'+id
     ).value
    )
  },

  raccordi:
   Number(
    document.getElementById(
     'rac-'+id
    ).value
   ),

  anomalia:{

   presente:
    document.getElementById(
     'ano-'+id
    ).value === 'true',

   descrizione:
    document.getElementById(
     'adesc-'+id
    ).value.trim()
  },

  note:
   document.getElementById(
    'note-'+id
   ).value.trim(),

  note_operatore:
   nota
 };

 button.disabled=true;
 button.textContent=
  'REINVIO IN CORSO...';

 try{

  const r=
   await fetch(
    '/api/interventi/'+
    encodeURIComponent(id)+
    '/correzione-operatore',
    {
     method:'PATCH',

     headers:{
      'Content-Type':
       'application/json'
     },

     body:
      JSON.stringify(payload)
    }
   );

  const data=
   await r.json();

  if(
   !r.ok ||
   !data.ok
  ){

   const extra=
    Array.isArray(data.errori)
     ? ': '+data.errori.join(', ')
     : '';

   throw new Error(
    (data.error || 'Reinvio fallito')+
    extra
   );
  }

  msg.style.color='#20e88b';

  msg.textContent=
   '✓ Correzione reinviata al Supervisore';

  setTimeout(
   carica,
   700
  );

 }catch(e){

  msg.style.color='#ff7777';
  msg.textContent=e.message;

  button.disabled=false;
  button.textContent=
   'REINVIA AL SUPERVISORE';
 }
}

carica();

</script>

</body>
</html>
