<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NMA BUILD OS — Enterprise Control</title><style>*{box-sizing:border-box}body{margin:0;background:#071015;color:#eef7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 22px;border-bottom:1px solid #244650;background:#08141a;position:sticky;top:0}h1{margin:0;font-size:18px}main{max-width:1180px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#0d1b22;border:1px solid #244650;border-radius:14px;padding:16px;margin-bottom:12px}.card small{color:#87a3aa}.card strong{font-size:22px;display:block;margin-top:8px}.ok{color:#20e88b}.warn{color:#ffb650}button{background:#15333f;color:white;border:1px solid #31515a;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;color:#bfe8f3;background:#061015;padding:12px;border-radius:10px;max-height:420px;overflow:auto}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>NMA BUILD OS — ENTERPRISE CONTROL 4.6.0</h1></header><main><div class="grid"><div class="card"><small>READINESS</small><strong id="ready">…</strong></div><div class="card"><small>MONGODB</small><strong id="mongo">…</strong></div><div class="card"><small>UPTIME</small><strong id="up">…</strong></div><div class="card"><small>MEMORIA RSS</small><strong id="mem">…</strong></div></div><div class="card"><button onclick="loadAll()">AGGIORNA</button> <button onclick="integrity()">INTEGRITÀ FILE</button><pre id="out">Caricamento…</pre></div></main><script>async function j(u){const r=await fetch(u,{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||u+' '+r.status);return d}function mb(n){return (Number(n||0)/1048576).toFixed(1)+' MB'}async function loadAll(){try{const d=await j('/api/enterprise/status');ready.textContent=d.readiness.status;ready.className=d.readiness.ok?'ok':'warn';mongo.textContent=d.readiness.checks.mongoConnected?'CONNECTED':'DISCONNECTED';mongo.className=d.readiness.checks.mongoConnected?'ok':'warn';up.textContent=Math.round(d.runtime.uptimeSec/60)+' min';mem.textContent=mb(d.runtime.memory.rss);out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent='ERRORE: '+e.message}}async function integrity(){try{out.textContent=JSON.stringify(await j('/api/enterprise/integrity'),null,2)}catch(e){out.textContent='ERRORE: '+e.message}}loadAll();</script></body></html>
